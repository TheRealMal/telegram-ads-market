basePath: /api/v1
definitions:
  ads-mrkt_internal_analytics_application_http_model.HistoryResponse:
    properties:
      avg_listings_per_user:
        items:
          type: number
        type: array
      commission_earned_ton:
        items:
          type: number
        type: array
      deal_amounts_by_status_ton:
        additionalProperties:
          items:
            format: float64
            type: number
          type: array
        type: object
      deals_by_status:
        additionalProperties:
          items:
            format: int64
            type: integer
          type: array
        type: object
      deals_count:
        items:
          type: integer
        type: array
      from:
        type: string
      listings_count:
        items:
          type: integer
        type: array
      period:
        type: string
      timestamps:
        items:
          type: integer
        type: array
      to:
        type: string
      users_count:
        items:
          type: integer
        type: array
    type: object
  ads-mrkt_internal_analytics_application_http_model.LatestSnapshotResponse:
    properties:
      snapshot:
        $ref: '#/definitions/ads-mrkt_internal_analytics_application_http_model.SnapshotResponse'
    type: object
  ads-mrkt_internal_analytics_application_http_model.SnapshotResponse:
    properties:
      avg_listings_per_user:
        type: number
      commission_earned_ton:
        type: number
      deal_amounts_by_status_ton:
        additionalProperties:
          format: float64
          type: number
        type: object
      deals_by_status:
        additionalProperties:
          format: int64
          type: integer
        type: object
      deals_count:
        type: integer
      id:
        type: integer
      listings_count:
        type: integer
      recorded_at:
        type: string
      users_count:
        type: integer
    type: object
  ads-mrkt_internal_market_application_market_http_model.AuthUserRequest:
    properties:
      referrer:
        type: integer
    type: object
  ads-mrkt_internal_market_application_market_http_model.CreateDealRequest:
    properties:
      channel_id:
        type: integer
      details:
        items:
          type: integer
        type: array
      duration:
        type: integer
      listing_id:
        type: integer
      message:
        type: string
      price:
        type: number
      type:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.CreateListingRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      channel_id:
        type: integer
      description:
        type: string
      prepared_post:
        items:
          type: integer
        type: array
      prices:
        items:
          type: integer
        type: array
      status:
        type: string
      type:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.DealChatLinkResponse:
    properties:
      chat_link:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.DealResponse:
    properties:
      channel_id:
        type: integer
      created_at:
        type: string
      details:
        items:
          type: integer
        type: array
      duration:
        type: integer
      escrow_address:
        type: string
      escrow_amount:
        type: integer
      escrow_release_time:
        type: string
      id:
        type: integer
      lessee_id:
        type: integer
      lessee_payout_address:
        type: string
      lessee_signature:
        type: string
      lessor_id:
        type: integer
      lessor_payout_address:
        type: string
      lessor_signature:
        type: string
      listing_id:
        type: integer
      message:
        type: string
      price:
        type: number
      status:
        $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.DealStatus'
      type:
        type: string
      updated_at:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.SetDealPayoutRequest:
    properties:
      wallet_address:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.SetWalletRequest:
    properties:
      wallet_address:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.UpdateDealDraftRequest:
    properties:
      details:
        items:
          type: integer
        type: array
      duration:
        type: integer
      price:
        type: number
      type:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.UpdateListingRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      description:
        type: string
      prepared_post:
        items:
          type: integer
        type: array
      prices:
        items:
          type: integer
        type: array
      status:
        type: string
      type:
        type: string
    type: object
  ads-mrkt_internal_market_application_market_http_model.WaitlistResponse:
    properties:
      channels_connected:
        items:
          $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.Channel'
        type: array
      referrals:
        items:
          $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.User'
        type: array
    type: object
  ads-mrkt_internal_market_domain_entity.Channel:
    properties:
      id:
        type: integer
      photo:
        type: string
      title:
        type: string
      username:
        type: string
    type: object
  ads-mrkt_internal_market_domain_entity.DealStatus:
    enum:
    - draft
    - approved
    - waiting_escrow_deposit
    - escrow_deposit_confirmed
    - in_progress
    - waiting_escrow_release
    - escrow_release_confirmed
    - completed
    - waiting_escrow_refund
    - escrow_refund_confirmed
    - expired
    - rejected
    type: string
    x-enum-varnames:
    - DealStatusDraft
    - DealStatusApproved
    - DealStatusWaitingEscrowDeposit
    - DealStatusEscrowDepositConfirmed
    - DealStatusInProgress
    - DealStatusWaitingEscrowRelease
    - DealStatusEscrowReleaseConfirmed
    - DealStatusCompleted
    - DealStatusWaitingEscrowRefund
    - DealStatusEscrowRefundConfirmed
    - DealStatusExpired
    - DealStatusRejected
  ads-mrkt_internal_market_domain_entity.Listing:
    properties:
      categories:
        description: JSON array of strings from predefined set
        items:
          type: integer
        type: array
      channel_followers:
        type: integer
      channel_id:
        type: integer
      channel_photo:
        type: string
      channel_title:
        type: string
      channel_username:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      prepared_post:
        description: 'JSON object, e.g. {"message": "ad text"}; extensible'
        items:
          type: integer
        type: array
      prices:
        items:
          type: integer
        type: array
      status:
        $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.ListingStatus'
      type:
        $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.ListingType'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  ads-mrkt_internal_market_domain_entity.ListingStatus:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - ListingStatusActive
    - ListingStatusInactive
  ads-mrkt_internal_market_domain_entity.ListingType:
    enum:
    - lessor
    - lessee
    type: string
    x-enum-varnames:
    - ListingTypeLessor
    - ListingTypeLessee
  ads-mrkt_internal_market_domain_entity.User:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      locale:
        type: string
      photo:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/ads-mrkt_pkg_auth_role.Role'
        description: user | admin
      username:
        type: string
      wallet_address:
        description: TON address in raw format
        type: string
    type: object
  ads-mrkt_internal_server_templates_response.Template:
    properties:
      data: {}
      error_code:
        type: string
      ok:
        type: boolean
    type: object
  ads-mrkt_pkg_auth_role.Role:
    enum:
    - user
    - admin
    - ""
    type: string
    x-enum-varnames:
    - UserRole
    - AdminRole
    - EmptyRole
host: localhost:8080
info:
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Swagger for Ads Market API
  version: "1.0"
paths:
  /analytics/snapshot/history:
    get:
      parameters:
      - description: 'Time range: week (7d), month (30d), year (365d)'
        enum:
        - week
        - month
        - year
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Timestamps (Unix) and metric series
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_analytics_application_http_model.HistoryResponse'
              type: object
        "400":
          description: Bad request (invalid period)
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal error
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      summary: Get analytics snapshot history for charts
      tags:
      - Analytics
  /analytics/snapshot/latest:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Latest snapshot (snapshot field null when none)
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_analytics_application_http_model.LatestSnapshotResponse'
              type: object
        "500":
          description: Internal error
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      summary: Get latest analytics snapshot
      tags:
      - Analytics
  /market/auth:
    post:
      consumes:
      - application/json
      parameters:
      - description: request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.AuthUserRequest'
      - description: Telegram init data
        in: header
        name: X-Telegram-InitData
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security: []
      summary: Authenticate user
      tags:
      - Market
  /market/channels/{id}/refresh:
    get:
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Channel
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_domain_entity.Channel'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Refresh (get) channel data by id; user must be admin of the channel
      tags:
      - Market
  /market/channels/{id}/stats:
    get:
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Channel stats (Telegram broadcast stats shape)
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Get channel statistics. Allowed for channel admins or users who have
        a listing with this channel.
      tags:
      - Market
  /market/deals:
    post:
      consumes:
      - application/json
      parameters:
      - description: deal body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.CreateDealRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created deal
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Create deal
      tags:
      - Market
  /market/deals/{id}:
    get:
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deal
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Get deal by ID (only if caller is lessor or lessee)
      tags:
      - Market
    patch:
      consumes:
      - application/json
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.UpdateDealDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated deal
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Update deal draft (type, duration, price, details). Clears both signatures.
      tags:
      - Market
  /market/deals/{id}/chat-link:
    post:
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Chat link to open in Telegram
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealChatLinkResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Get deal forum chat link. Caller must be lessor or lessee.
      tags:
      - Market
  /market/deals/{id}/payout-address:
    put:
      consumes:
      - application/json
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      - description: wallet_address (raw)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.SetDealPayoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated deal
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Set your payout address on the deal (lessor or lessee). Required before
        signing. Draft only.
      tags:
      - Market
  /market/deals/{id}/reject:
    post:
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Updated deal
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  $ref: '#/definitions/ads-mrkt_internal_market_application_market_http_model.DealResponse'
              type: object
        "400":
          description: Bad request
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "403":
          description: Forbidden (deal not draft or not a side)
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not found
          schema:
            allOf:
            - $ref: '#/definitions/ads-mrkt_internal_server_templates_response.Template'
            - properties:
                data:
                  type: string
              type: object
      security:
      - JWT: []
      summary: Reject deal. Only allowed when deal status is draft; caller must be
        lessor or lessee.
      tags:
      - Market
  /market/deals/{id}/sign:
    post:
      parameters:
      - description: Deal ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deal (possibly approved)
          schema:
            allOf:
